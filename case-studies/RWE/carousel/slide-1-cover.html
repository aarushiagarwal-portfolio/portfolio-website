<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RWE carousel, slide 1: cover</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3ed8c3}a:hover{color:#ffffff}
.s{position:relative;width:432px;height:540px;overflow:hidden;background:#1b3a6b;color:#ffffff;font-family:'Bricolage Grotesque',system-ui,sans-serif}
.label{position:absolute;top:24px;left:24px;font-family:Roboto,system-ui,sans-serif;font-size:15px;font-weight:700;letter-spacing:1.9px;text-transform:uppercase;color:#3ed8c3}
.folio{position:absolute;top:24px;right:24px;font-family:Roboto,system-ui,sans-serif;font-size:15px;font-weight:500}
.num{position:absolute;left:19px;top:51px;font-size:140px;font-weight:800;line-height:0.86;letter-spacing:-6.75px;white-space:nowrap;color:#3ed8c3}
.unit{position:absolute;right:24px;top:130px;font-family:Roboto,system-ui,sans-serif;font-size:16px;font-weight:700;text-align:right;line-height:1.3}
.card{position:absolute;width:202px;background:#ffffff;border-radius:11px;overflow:hidden;box-shadow:0 14px 32px rgba(0,0,0,0.28);font-family:Roboto,system-ui,sans-serif;color:#262626}
.ch{display:flex;align-items:center;gap:8px;padding:8px 11px;font-size:12px;font-weight:700}
.ring{width:27px;height:27px;border-radius:50%;padding:2px;box-sizing:border-box;background:linear-gradient(45deg,#8B1A1A,#C0392B,#E91E8C,#FF6B35);display:flex;flex:none}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:top;border:2px solid #ffffff;box-sizing:border-box}
.ci{display:block;width:202px;height:178px;object-fit:cover}
.ca{display:flex;gap:11px;padding:8px 11px 9px}
.head{position:absolute;left:24px;right:24px;bottom:19px;font-size:19px;font-weight:700;line-height:1.2;letter-spacing:-0.15px}
</style>
</head>
<body>
<div class="s">
<div class="label">Always-on social</div>
<div class="folio">01 / 06</div>
<div class="hero" style="position: absolute; left: 19px; right: 24px; top: 51px; display: flex; justify-content: space-between; align-items: center">
<div class="num" style="position: static">37M</div>
<div class="unit" style="position: static">impressions<br>15 countries</div>
</div>
<div class="card" style="left: 202px; top: 192px; transform: rotate(7deg)">
<div class="ch"><div class="ring"><img src="images/rwe-logo.png" alt=""></div>rwe.global</div>
<img class="ci" src="images/slide1-right-card.jpg" alt="RWE post: to friends" style="object-position: center 30%">
<div class="ca"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2.2" aria-hidden="true"><path d="M12 21s-7-4.4-9.3-8.6C1 9 3 5 6.8 5c2.2 0 3.6 1.3 5.2 3 1.6-1.7 3-3 5.2-3C21 5 23 9 21.3 12.4 19 16.6 12 21 12 21z"></path></svg><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2.2" aria-hidden="true"><path d="M21 12a8.5 8.5 0 0 1-12.3 7.6L3 21l1.4-5.4A8.5 8.5 0 1 1 21 12z"></path></svg></div>
</div>
<div class="card" style="left: 40px; top: 202px; transform: rotate(-5deg)">
<div class="ch"><div class="ring"><img src="images/rwe-logo.png" alt=""></div>rwe.global</div>
<img class="ci" src="images/slide1-left-card.jpg" alt="RWE post: this is who keeps the team in check" style="object-position: center 35%">
<div class="ca"><svg width="17" height="17" viewBox="0 0 24 24" fill="#E91E8C" stroke="#E91E8C" stroke-width="2.2" aria-hidden="true"><path d="M12 21s-7-4.4-9.3-8.6C1 9 3 5 6.8 5c2.2 0 3.6 1.3 5.2 3 1.6-1.7 3-3 5.2-3C21 5 23 9 21.3 12.4 19 16.6 12 21 12 21z"></path></svg><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2.2" aria-hidden="true"><path d="M21 12a8.5 8.5 0 0 1-12.3 7.6L3 21l1.4-5.4A8.5 8.5 0 1 1 21 12z"></path></svg></div>
</div>
<div class="head">Retention through authentic, behind-the-scenes storytelling.</div>
</div>
</body>
</html>
