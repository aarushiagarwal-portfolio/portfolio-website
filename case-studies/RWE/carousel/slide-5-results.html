<style>

.mint{color:#3ed8c3}
.card{position:absolute;box-sizing:border-box;padding:16px;border-radius:16px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}

.fp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:10px}
.fc{display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 6px}
.fc + .fc{border-left:1px solid rgba(255,255,255,0.14)}
.fv{height:32px;display:flex;align-items:center}
.fn{font-size:24px;font-weight:800;line-height:0.9;letter-spacing:-0.6px;color:#3ed8c3}
.fn small{font-family:Roboto,system-ui,sans-serif;font-size:11px;font-weight:500;letter-spacing:0;color:#dfe7f2;margin-left:4px}
