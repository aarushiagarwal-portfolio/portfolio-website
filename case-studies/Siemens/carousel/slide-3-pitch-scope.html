<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base target="_blank">
<title>Siemens carousel, slide 3: pitch scope</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.s{position:relative;width:432px;height:540px;overflow:hidden;background:#F5F6F8;color:#000028;font-family:'Bricolage Grotesque',system-ui,sans-serif}
.label{position:absolute;top:24px;left:24px;font-family:Roboto,system-ui,sans-serif;font-size:15px;font-weight:700;letter-spacing:1.9px;text-transform:uppercase;color:#000028}
.label::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#08F4C7;margin-right:8px;vertical-align:1px}
.folio{position:absolute;top:24px;right:24px;font-family:Roboto,system-ui,sans-serif;font-size:15px;font-weight:500;color:rgba(0,0,40,0.62)}
.title{position:absolute;left:24px;right:24px;top:62px;margin:0;font-size:40px;font-weight:800;line-height:1.08;letter-spacing:-1.5px;color:#000028}
.hl{background:#001234;color:#08F4C7;padding:0 10px 2px;border-radius:10px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.body{margin:0;font-family:Roboto,system-ui,sans-serif;font-size:14px;line-height:1.5;color:rgba(0,0,40,0.62)}
.sm{font-family:Roboto,system-ui,sans-serif;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
.navy{background:#001234;color:#ffffff;border-radius:22px}
.card{background:#ffffff;border-radius:18px;box-shadow:0 1px 0 rgba(0,0,40,0.05),0 10px 24px rgba(0,0,40,0.07)}

.dash{position:absolute;left:24px;right:24px;top:166px;height:262px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
.cell{padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between}
.cell:nth-child(1),.cell:nth-child(2){border-bottom:1px solid rgba(255,255,255,0.14)}
.cell:nth-child(odd){border-right:1px solid rgba(255,255,255,0.14)}
.cell .sm{color:rgba(255,255,255,0.75)}
.bn{font-size:46px;font-weight:800;line-height:0.86;letter-spacing:-1.8px;color:#08F4C7}
.bl{font-family:Roboto,system-ui,sans-serif;font-size:15px;font-weight:500;color:#ffffff;margin-top:8px}
.head{position:absolute;left:24px;right:24px;bottom:24px;margin:0;font-size:22px;font-weight:700;line-height:1.2;letter-spacing:-0.4px}
</style>
</head>
<body>
<div class="s">
<div class="label">Pitch scope</div>
<div class="folio">03 / 04</div>
<h2 class="title">The pitch,<br><span class="hl">in numbers.</span></h2>
<div class="dash navy">
<div class="cell"><div class="sm">Timeline</div><div><div class="bn">7</div><div class="bl">days, brief to pitch</div></div></div>
<div class="cell"><div class="sm">Markets</div><div><div class="bn">6</div><div class="bl">countries</div></div></div>
<div class="cell"><div class="sm">Audience</div><div><div class="bn">22–35</div><div class="bl">age range</div></div></div>
<div class="cell"><div class="sm">Channel</div><div><div style="height: 40px; display: flex; align-items: flex-end"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#08F4C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Instagram"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.3" cy="6.7" r="0.6"></circle></svg></div><div class="bl">Instagram</div></div></div>
</div>
<p class="head">For engineers, tech talent and young professionals.</p>
</div>
</body>
</html>
