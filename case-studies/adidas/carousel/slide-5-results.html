<!doctype html>

<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.s{position:relative;width:432px;height:540px;overflow:hidden;background:#ffffff;color:#000000;font-family:'Bricolage Grotesque',system-ui,sans-serif}
.label{position:absolute;top:24px;left:24px;font-family:Roboto,system-ui,sans-serif;font-size:15px;font-weight:700;letter-spacing:1.9px;text-transform:uppercase;color:#000000}
.folio{position:absolute;top:24px;right:24px;font-family:Roboto,system-ui,sans-serif;font-size:15px;font-weight:500;color:#767677}

.fn{font-size:28px;font-weight:800;line-height:0.9;letter-spacing:-0.8px}

<div class="s">
